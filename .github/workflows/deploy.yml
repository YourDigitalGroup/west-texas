name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            README.md
            .gitignore
            # Live site data (site.json, users.json, pages, SEO, revisions…) is
            # edited by the CMS on the server. The copies in this repo are the
            # blank template files from setup — never let a deploy overwrite the
            # real ones. (A brand-new site DOES need data/ deployed once, so do
            # not copy this line into the Site Factory template.)
            data/**
            docs/**
